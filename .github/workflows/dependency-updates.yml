name: dependency-updates
on:
  push:
    branches:
      - develop
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  version-updates:
    name: ${{ matrix.name }}-update
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: awslc
            arg: AWSLC
            repo: aws/aws-lc
          - name: ngtcp2
            arg: NGTCP2
            repo: ngtcp2/ngtcp2
          - name: nghttp3
            arg: NGHTTP3
            repo: ngtcp2/nghttp3
          - name: nghttp2
            arg: NGHTTP2
            repo: nghttp2/nghttp2
          - name: zstd
            arg: ZSTD
            repo: facebook/zstd
            filter: ^v\?[0-9.]\+$
          - name: brotli
            arg: BROTLI
            repo: google/brotli
          - name: zlibng
            arg: ZLIBNG
            repo: zlib-ng/zlib-ng
            filter: ^[0-9.]\+$
          - name: cares
            arg: CARES
            repo: c-ares/c-ares
          - name: curl
            arg: CURL
            repo: curl/curl
            pattern: curl-*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: update ${{ matrix.name }} version
        id: update
        run: |
          VERSION="$(
          git ls-remote --tags --refs https://github.com/${{ matrix.repo }} ${{ matrix.pattern }} \
              | cut -d/ -f3 \
              | grep "${{ matrix.filter || '.' }}" \
              | sed 's|rc|~&|I' \
              | sort -V \
              | sed 's|~||' \
              | tail -1
          )"
          SHA="$(git ls-remote https://github.com/${{ matrix.repo }} "$VERSION" | cut -f1)"
          echo "compare=https://github.com/${{ matrix.repo }}/compare/$(sed -n 's|^ARG ${{ matrix.arg }}_VERSION=\(.*\) #.*|\1|p' Dockerfile)...$SHA" >> $GITHUB_OUTPUT
          sed -i "s|ARG ${{ matrix.arg }}_VERSION=.*|ARG ${{ matrix.arg }}_VERSION=$SHA # $VERSION|" Dockerfile
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          signoff: true
          delete-branch: true
          commit-message: update ${{ matrix.name }} version to ${{ steps.update.outputs.version }}
          branch: update-${{ matrix.name }}-version
          title: update ${{ matrix.name }} version to ${{ steps.update.outputs.version }}
          body: ${{ steps.update.outputs.compare }}
